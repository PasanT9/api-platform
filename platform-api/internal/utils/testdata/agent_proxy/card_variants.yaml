apiVersion: gateway.api-platform.wso2.com/v1
kind: Agent
metadata:
    name: travel-agent
    labels:
        project-id: test-project
    annotations:
        gateway.api-platform.wso2.com/project-id: test-project
spec:
    displayName: Travel Agent
    version: v2.1
    upstream:
        url: https://travel-agent.internal:8443/a2a
    resilience:
        timeout: 30s
    a2a:
        protocolVersion: "1.0"
        operationConfigs:
            transports:
                - protocolBinding: HTTP+JSON
        agentCard:
            public:
                rewriteUrls: false
            protected:
                mode: managed
                content:
                    capabilities:
                        streaming: false
                    name: Travel Agent
                    skills: []
                    supportedInterfaces:
                        - protocolBinding: HTTP+JSON
                          protocolVersion: "1.0"
                          url: https://agents.example.com/
                    version: 2.1.0
