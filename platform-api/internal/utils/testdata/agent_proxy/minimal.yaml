apiVersion: gateway.api-platform.wso2.com/v1
kind: Agent
metadata:
    name: weather-agent
    labels:
        project-id: test-project
    annotations:
        gateway.api-platform.wso2.com/project-id: test-project
spec:
    displayName: Weather Agent
    version: v1.0
    context: /weather
    upstream:
        url: http://weather-agent:9000
    a2a:
        protocolVersion: "1.0"
        operationConfigs:
            transports:
                - protocolBinding: JSONRPC
                  pathPrefix: /rpc
